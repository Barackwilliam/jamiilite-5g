# Render Blueprint: mfumo mzima wa JamiiLite 5G (dashboard, portal, superadmin, ripoti za routers).
# Routers zinahifadhi vocha zenyewe (JAMIILITE_AUTH_MODE=local), kwa hiyo hakuna RADIUS server
# wala VPS inayohitajika. Angalia docs/DEPLOY.md.
services:
  - type: web
    name: jamiilite
    runtime: python
    plan: free
    # Karibu na Supabase (us-east-1): kila query inachukua milisekunde chache.
    region: virginia
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py ensure_superuser
    startCommand: gunicorn config.wsgi --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Supabase -> Connect -> Session pooler (port 5432). Inafanya kazi kwa IPv4.
      - key: DATABASE_URL
        sync: false
      # Router inathibitisha vocha zilizo ndani yake, na kuripoti kila sekunde 10.
      - key: JAMIILITE_AUTH_MODE
        value: local
      - key: JAMIILITE_CHECKIN_SECONDS
        value: "10"
      # mfano https://jamiilite.onrender.com au domain yako
      - key: JAMIILITE_PUBLIC_URL
        sync: false
      # Domain yako ukiiunganisha (jina la onrender.com linaongezwa lenyewe)
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: jamiilite-media
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      # Malipo halisi bado hayajaunganishwa. Sandbox inampa mteja vocha BILA kulipa:
      # tumia kwa majaribio tu, na uweke False kabla ya kupokea wateja halisi.
      - key: PAYMENT_PROVIDER
        value: sandbox
      - key: ALLOW_SANDBOX_PAYMENTS
        value: "True"
      # Pesapal: badilisha PAYMENT_PROVIDER kuwa "pesapal", weka keys, kisha ALLOW_SANDBOX_PAYMENTS=False.
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_ENV
        value: sandbox
      - key: JAMIILITE_WHATSAPP_NUMBER
        sync: false
      # Sentry (si lazima): kila kosa linakufikia kwa email. Angalia docs/DEPLOY.md.
      - key: SENTRY_DSN
        sync: false
      # Super Admin wa kwanza (Render Free haina Shell). Akishatengenezwa, futa password hapa.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
