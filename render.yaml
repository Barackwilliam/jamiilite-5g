# Render Blueprint: website ya JamiiLite 5G (dashboard, portal, superadmin).
# RADIUS haiwezi kukaa Render (haipokei UDP); inakaa Google Cloud. Angalia docs/DEPLOY.md.
services:
  - type: web
    name: jamiilite
    runtime: python
    plan: free
    # Karibu na Supabase (us-east-1) na RADIUS ya Google (us-east1): kila query inachukua milisekunde chache.
    region: virginia
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Supabase -> Connect -> Session pooler (port 5432). Inafanya kazi kwa IPv4.
      - key: DATABASE_URL
        sync: false
      # IP ya kudumu ya server ya RADIUS (Google Cloud)
      - key: RADIUS_PUBLIC_ADDRESS
        sync: false
      # mfano https://jamiilite.onrender.com au domain yako
      - key: JAMIILITE_PUBLIC_URL
        sync: false
      # Domain yako ukiiunganisha (jina la onrender.com linaongezwa lenyewe)
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: jamiilite-media
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      # Malipo halisi bado hayajaunganishwa. Sandbox inampa mteja vocha BILA kulipa:
      # tumia kwa majaribio tu, na uweke False kabla ya kupokea wateja halisi.
      - key: PAYMENT_PROVIDER
        value: sandbox
      - key: ALLOW_SANDBOX_PAYMENTS
        value: "True"
      - key: JAMIILITE_WHATSAPP_NUMBER
        sync: false
