# Backup ya database kila usiku (saa 8:17 usiku, saa za Tanzania).
#
# Repo hii ni ya wazi, kwa hiyo backup INASIMBWA (AES-256) kabla ya kuhifadhiwa:
# bila BACKUP_PASSPHRASE haiwezi kufunguliwa na mtu yeyote. Inakaa siku 30
# kwenye Actions → workflow hii → run → Artifacts. Jinsi ya kurudisha: docs/DEPLOY.md.
#
# Siri zinazohitajika (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL  connection string ya Supabase (Session pooler, port 5432)
#   BACKUP_PASSPHRASE    neno la siri refu; lihifadhi mahali salama, bila hilo backup haifunguki
name: Backup ya database

on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Hakiki siri zipo
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Weka BACKUP_DATABASE_URL na BACKUP_PASSPHRASE kwenye Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 16 ]; then
            echo "::error::BACKUP_PASSPHRASE iwe na herufi 16 au zaidi."
            exit 1
          fi

      - name: Weka pg_dump 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Chukua backup na uisimbe
        run: |
          set -euo pipefail
          name="jamiilite-$(date -u +%Y-%m-%d)"
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"
          # Schema ya "public" tu: hapo ndipo tables zote za Django zilipo.
          /usr/lib/postgresql/17/bin/pg_dump "$BACKUP_DATABASE_URL" \
            --schema=public --no-owner --no-privileges --format=custom --file=backup.dump
          # Hakiki backup inasomeka kabla ya kuisimba.
          /usr/lib/postgresql/17/bin/pg_restore --list backup.dump > /dev/null
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "$name.dump.gpg" backup.dump
          rm -f backup.dump
          ls -lh "$name.dump.gpg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.dump.gpg
          retention-days: 30
          if-no-files-found: error
