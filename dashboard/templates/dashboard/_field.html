<div class="field{% if field.errors %} has-error{% endif %}{% if field.field.widget.input_type == 'checkbox' %} field-check{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label>{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<small class="field-help">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
</div>
