{% load static i18n %}{% get_current_language as LANG %}<!doctype html>
<html lang="{{ LANG }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% translate "Jaribu tena" %} · JamiiLite 5G</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      background: #071533; color: #e6ecf7; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .box { width: 100%; max-width: 380px; padding: 28px 22px; border-radius: 20px; text-align: center;
      background: #0f2448; border: 1px solid rgba(255, 255, 255, 0.12); }
    .icon { display: grid; place-items: center; width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 16px;
      background: linear-gradient(100deg, #ffb627, #f5a623 55%, #ff7a3d); color: #2a1702; font-size: 1.6rem; font-weight: 800; }
    h1 { margin: 0 0 8px; font-size: 1.25rem; }
    p { margin: 0 0 20px; color: #a7b3ca; }
    a { display: block; padding: 13px 18px; border-radius: 999px; text-decoration: none; font-weight: 800;
      background: linear-gradient(100deg, #ffb627, #f5a623 55%, #ff7a3d); color: #2a1702; }
  </style>
</head>
<body>
  <main class="box">
    <div class="icon" aria-hidden="true">↻</div>
    <h1>{% translate "Ukurasa umepitwa na wakati" %}</h1>
    <p>{% translate "Fungua ukurasa upya, kisha ujaribu tena." %}</p>
    <a href="{{ back_url }}">{% translate "Jaribu tena" %}</a>
  </main>
</body>
</html>
