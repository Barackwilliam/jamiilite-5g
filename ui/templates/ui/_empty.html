{% load ui_tags %}
<div class="empty-state">
  <span class="empty-art" aria-hidden="true">
    <svg viewBox="0 0 120 80" class="empty-blob"><path d="M18 46C10 24 32 6 58 8s52 10 50 34-28 34-52 32S26 68 18 46z"/></svg>
    <span class="empty-icon">{% icon icon|default:"wifi" 26 %}</span>
  </span>
  {% if title %}<p><strong>{{ title }}</strong></p>{% endif %}
  <p class="muted">{{ text }}</p>
  {% if link_url %}<a class="btn btn-small" href="{{ link_url }}">{{ link_text }}</a>{% endif %}
</div>
