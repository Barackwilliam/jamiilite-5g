{% load i18n %}{% comment %}
Chati ya bar ya mfululizo mmoja. Inahitaji `chart` kutoka ui.charts.bar_chart
na `title`. Hakuna legend: kichwa cha kadi kinasema chati inaonyesha nini.
{% endcomment %}
<figure class="chart" data-chart>
  {% if chart.is_empty %}
    <div class="chart-empty">
      <p><strong>{% if empty %}{{ empty }}{% else %}{% translate "Bado hakuna mauzo kwenye kipindi hiki." %}{% endif %}</strong></p>
      <p class="muted">{% if empty_hint %}{{ empty_hint }}{% else %}{% translate "Mauzo yakianza, utayaona hapa kila siku." %}{% endif %}</p>
    </div>
  {% else %}
    <svg viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-label="{{ title }}, {% translate "jumla" %} {{ chart.total_display }}">
      <defs><linearGradient id="chart-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc456"/><stop offset="1" stop-color="#f5a623" stop-opacity="0.55"/></linearGradient></defs>
      {% for tick in chart.ticks %}
        <line class="chart-grid" x1="{{ chart.plot_left }}" x2="{{ chart.plot_right }}" y1="{{ tick.y }}" y2="{{ tick.y }}"/>
        <text class="chart-tick" x="{{ chart.plot_left|add:'-8' }}" y="{{ tick.y }}" dy="4" text-anchor="end">{{ tick.label }}</text>
      {% endfor %}
      {% for bar in chart.bars %}
        <g class="chart-bar" tabindex="0" data-label="{{ bar.day_label }}" data-value="{{ bar.value_display }}">
          <rect class="chart-hit" x="{{ bar.hit_x }}" y="{{ chart.plot_top }}" width="{{ bar.hit_w }}" height="{{ chart.plot_h }}"/>
          {% if bar.path %}<path class="chart-mark" style="fill: url(#chart-gold)" d="{{ bar.path }}"/>{% endif %}
          {% if bar.is_peak %}<text class="chart-peak" x="{{ bar.label_x }}" y="{{ bar.top_y }}" text-anchor="middle">{{ bar.peak_label }}</text>{% endif %}
          {% if bar.show_label %}<text class="chart-day" x="{{ bar.label_x }}" y="{{ chart.label_y }}" text-anchor="middle">{{ bar.day_label }}</text>{% endif %}
        </g>
      {% endfor %}
    </svg>
    <div class="chart-tooltip" role="status" hidden><strong></strong><span></span></div>
  {% endif %}
  <details class="chart-table">
    <summary>{% translate "Ona kama jedwali" %}</summary>
    <table>
      <thead><tr><th scope="col">{% translate "Siku" %}</th><th scope="col">{% translate "Kiasi" %}</th></tr></thead>
      <tbody>
        {% for bar in chart.bars %}<tr><td>{{ bar.date|date:"d/m/Y" }}</td><td>{{ bar.value_display }}</td></tr>{% endfor %}
      </tbody>
      <tfoot><tr><th scope="row">{% translate "Jumla" %}</th><td>{{ chart.total_display }}</td></tr></tfoot>
    </table>
  </details>
</figure>
