{% load ui_tags %}
{% if page.has_other_pages %}
  <nav class="pager" aria-label="Kurasa">
    {% if page.has_previous %}<a class="btn btn-small btn-ghost" href="{% page_url page.previous_page_number %}">← Nyuma</a>{% else %}<span></span>{% endif %}
    <span class="muted small">Ukurasa {{ page.number }} kati ya {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a class="btn btn-small btn-ghost" href="{% page_url page.next_page_number %}">Mbele →</a>{% else %}<span></span>{% endif %}
  </nav>
{% endif %}
