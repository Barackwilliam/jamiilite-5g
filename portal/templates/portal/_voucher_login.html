{% load i18n %}{% comment %}
Fomu inayotuma vocha moja kwa moja kwa MikroTik (login-by=http-pap).
Vocha inatumika kama username na password.
{% endcomment %}
<form method="post" action="{{ login_target }}" class="stack voucher-login" data-autosubmit="{{ autosubmit|yesno:'1,0' }}">
  {% if code %}
    <input type="hidden" name="username" value="{{ code }}">
    <input type="hidden" name="password" value="{{ code }}">
  {% else %}
    <label class="field">
      <span>{% translate "Namba ya vocha" %}</span>
      <input type="text" name="username" required autocapitalize="characters" autocomplete="off" placeholder="{% translate 'mfano' %} 7K4QX9MP">
    </label>
    <input type="hidden" name="password" value="">
  {% endif %}
  {% if dst %}<input type="hidden" name="dst" value="{{ dst }}">{% endif %}
  <input type="hidden" name="popup" value="true">
  <button type="submit" class="btn {% if not code %}btn-secondary{% endif %}">{% translate "Unganisha" %}</button>
</form>
<script>
  document.querySelectorAll("form.voucher-login").forEach(function (form) {
    form.addEventListener("submit", function () {
      var user = form.querySelector("[name=username]");
      user.value = user.value.trim().toUpperCase();
      form.querySelector("[name=password]").value = user.value;
    });
    if (form.dataset.autosubmit === "1") {
      setTimeout(function () { form.requestSubmit ? form.requestSubmit() : form.submit(); }, 1500);
    }
  });
</script>
